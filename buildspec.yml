version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      java: corretto17

  build:
    commands:
      - echo "Building backend..."
      - chmod +x gradlew
      - ./gradlew clean bootJar -x test

  post_build:
    commands:
      - echo "Build completed."

artifacts:
  files:
    - build/libs/*.jar
    - appspec.yml
    - deploy/moa-api.service
    - scripts/**/*
  discard-paths: no