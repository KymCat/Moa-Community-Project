<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Blog Home</title>

    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">

    <script defer src="/js/theme.js"></script>
    <script defer src="/js/api.js"></script>
    <script defer src="/js/ui.js"></script>
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/posts.js"></script>
    <script defer src="/js/index.js"></script>
</head>
<body>

<button id="themeToggle" class="theme-btn">🌙</button>

<main class="auth-container">
    <div class="page-layout">

        <div class="user-menu">
            <button id="userMenuButton" class="user-button">나</button>

            <div id="userCard" class="user-card">
                <p class="user-card-title">로그인 사용자</p>

                <div class="user-info-row">
                    <span>아이디</span>
                    <strong id="userId">-</strong>
                </div>

                <div class="user-info-row">
                    <span>별명</span>
                    <strong id="userName">-</strong>
                </div>

                <button id="logoutButton" class="primary-btn user-logout-btn">
                    로그아웃
                </button>

                <button id="openAccountModalButton" class="secondary-btn user-action-btn">
                    회원 정보 수정
                </button>

                <button id="deleteAccountButton" class="danger-btn user-action-btn">
                    회원 탈퇴
                </button>
            </div>
        </div>

        <section class="auth-card post-section">
            <div class="post-header">
                <h1>게시글</h1>

                <button id="openPostModalButton" class="write-post-btn">
                    +
                    <span class="tooltip">글쓰기</span>
                </button>
            </div>

            <div id="postList" class="post-list"></div>

            <div id="pagination" class="pagination"></div>
        </section>

    </div>
</main>

<div id="postModalOverlay" class="modal-overlay">
    <div class="post-modal">
        <h2 id="postModalTitle">게시글 작성</h2>

        <form id="postCreateForm">
            <input id="postId" type="hidden">

            <input
                    id="postTitle"
                    type="text"
                    placeholder="제목을 입력하세요"
                    maxlength="100"
            >
            <div id="postTitleCount" class="char-count">0 / 100</div>

            <textarea
                    id="postContent"
                    placeholder="내용을 입력하세요"
                    maxlength="6000"
            ></textarea>
            <div id="postContentCount" class="char-count">0 / 6000</div>

            <p id="postCreateMessage" class="message"></p>

            <div class="modal-buttons">
                <button type="button" id="closePostModalButton" class="secondary-btn">
                    취소
                </button>

                <button type="submit" class="primary-btn">
                    저장
                </button>
            </div>
        </form>
    </div>
</div>

<div id="accountModalOverlay" class="modal-overlay">
    <div class="post-modal account-modal">
        <h2>회원 정보 수정</h2>

        <form id="nameUpdateForm" class="stack-form">
            <label for="newName">닉네임</label>
            <input id="newName" type="text" maxlength="30" placeholder="새 닉네임">
            <button type="submit" class="primary-btn">닉네임 변경</button>
        </form>

        <form id="passwordUpdateForm" class="stack-form">
            <label for="currentPassword">현재 비밀번호</label>
            <input id="currentPassword" type="password" placeholder="현재 비밀번호">

            <label for="newPassword">새 비밀번호</label>
            <input id="newPassword" type="password" maxlength="15" placeholder="새 비밀번호">

            <button type="submit" class="primary-btn">비밀번호 변경</button>
        </form>

        <p id="accountMessage" class="message"></p>

        <button type="button" id="closeAccountModalButton" class="secondary-btn">
            닫기
        </button>
    </div>
</div>
</body>
</html>
