<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Blog Home</title>

    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">

    <script defer src="/js/theme.js"></script>
    <script defer src="/js/api.js"></script>
    <script defer src="/js/index.js"></script>
</head>
<body>

<button id="themeToggle" class="theme-btn">🌙</button>

<main class="auth-container">
    <div class="page-layout">

        <div class="user-menu">
            <button id="userMenuButton" class="user-button">나</button>

            <div id="userCard" class="user-card">
                <p class="user-card-title">로그인 사용자</p>

                <div class="user-info-row">
                    <span>아이디</span>
                    <strong id="userId">-</strong>
                </div>

                <div class="user-info-row">
                    <span>별명</span>
                    <strong id="userName">-</strong>
                </div>

                <button id="logoutButton" class="primary-btn user-logout-btn">
                    로그아웃
                </button>
            </div>
        </div>

        <section class="auth-card post-section">
            <div class="post-header">
                <h1>게시글</h1>

                <button id="openPostModalButton" class="write-post-btn">
                    ✏️
                    <span class="tooltip">글쓰기</span>
                </button>
            </div>

            <div id="postList" class="post-list"></div>

            <div id="pagination" class="pagination"></div>
        </section>

    </div>
</main>

<div id="postModalOverlay" class="modal-overlay">
    <div class="post-modal">
        <h2>게시글 작성</h2>

        <form id="postCreateForm">
            <input
                    id="postTitle"
                    type="text"
                    placeholder="제목을 입력하세요"
                    maxlength="100"
            >

            <textarea
                    id="postContent"
                    placeholder="내용을 입력하세요"
                    maxlength="6000"
            ></textarea>

            <p id="postCreateMessage" class="message"></p>

            <div class="modal-buttons">
                <button type="button" id="closePostModalButton" class="secondary-btn">
                    취소
                </button>

                <button type="submit" class="primary-btn">
                    등록
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
