<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>

    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">

    <script defer src="/js/theme.js"></script>
    <script defer src="/js/api.js"></script>
    <script defer src="/js/ui.js"></script>
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/mypage.js"></script>
</head>
<body>
<button id="themeToggle" class="theme-btn" aria-label="테마 변경">🌙</button>

<main class="mypage-container">
    <div class="mypage-layout">
        <header class="mypage-header">
            <div>
                <p class="mypage-eyebrow">MY BLOG</p>
                <h1>마이페이지</h1>
                <p class="mypage-description">내 정보와 작성한 활동을 한곳에서 관리하세요.</p>
            </div>

            <div class="mypage-header-actions">
                <a class="secondary-btn header-link" href="/">게시글 목록</a>
                <button id="mypageLogoutButton" type="button" class="primary-btn header-button">로그아웃</button>
            </div>
        </header>

        <section class="mypage-card">
            <div class="mypage-tabs" role="tablist" aria-label="마이페이지 메뉴">
                <button id="profileTab" class="mypage-tab active" type="button" role="tab"
                        aria-selected="true" aria-controls="profilePanel" data-tab="profile">
                    내 정보
                </button>
                <button id="postsTab" class="mypage-tab" type="button" role="tab"
                        aria-selected="false" aria-controls="postsPanel" data-tab="posts" tabindex="-1">
                    작성한 게시글
                </button>
                <button id="commentsTab" class="mypage-tab" type="button" role="tab"
                        aria-selected="false" aria-controls="commentsPanel" data-tab="comments" tabindex="-1">
                    작성한 댓글
                </button>
            </div>

            <div id="profilePanel" class="mypage-panel active" role="tabpanel"
                 aria-labelledby="profileTab" data-panel="profile">
                <div class="profile-summary">
                    <div class="profile-avatar" aria-hidden="true">나</div>
                    <div>
                        <p class="profile-label">로그인 계정</p>
                        <strong id="mypageUserName" class="profile-name">-</strong>
                        <span id="mypageUserId" class="profile-id">-</span>
                    </div>
                </div>

                <div class="account-form-grid">
                    <form id="mypageNameForm" class="settings-card">
                        <div>
                            <h2>닉네임 변경</h2>
                            <p>게시글과 댓글에 표시되는 이름입니다.</p>
                        </div>

                        <label for="mypageNewName">새 닉네임</label>
                        <input id="mypageNewName" type="text" minlength="2" maxlength="30"
                               pattern="[a-zA-Z0-9가-힣]+" required>
                        <p id="mypageNameMessage" class="message form-message" aria-live="polite"></p>
                        <button type="submit" class="primary-btn">닉네임 저장</button>
                    </form>

                    <form id="mypagePasswordForm" class="settings-card">
                        <div>
                            <h2>비밀번호 변경</h2>
                            <p>현재 비밀번호를 확인한 뒤 변경합니다.</p>
                        </div>

                        <label for="mypageCurrentPassword">현재 비밀번호</label>
                        <div class="password-input-wrapper">
                            <input id="mypageCurrentPassword" type="password" minlength="8" maxlength="15"
                                   autocomplete="current-password" required>
                            <button class="password-visibility-button" type="button"
                                    data-password-target="mypageCurrentPassword"
                                    aria-label="현재 비밀번호 표시" aria-pressed="false">👁</button>
                        </div>

                        <label for="mypageNewPassword">새 비밀번호</label>
                        <div class="password-input-wrapper">
                            <input id="mypageNewPassword" type="password" minlength="8" maxlength="15"
                                   autocomplete="new-password" required>
                            <button class="password-visibility-button" type="button"
                                    data-password-target="mypageNewPassword"
                                    aria-label="새 비밀번호 표시" aria-pressed="false">👁</button>
                        </div>
                        <p id="mypagePasswordMessage" class="message form-message" aria-live="polite"></p>
                        <button type="submit" class="primary-btn">비밀번호 저장</button>
                    </form>
                </div>

                <div class="danger-zone">
                    <div>
                        <h2>회원 탈퇴</h2>
                        <p>탈퇴 후에는 계정 정보를 복구할 수 없습니다.</p>
                    </div>
                    <button id="mypageDeleteAccountButton" type="button" class="danger-btn">회원 탈퇴</button>
                </div>
            </div>

            <div id="postsPanel" class="mypage-panel" role="tabpanel"
                 aria-labelledby="postsTab" data-panel="posts" hidden>
                <div class="panel-heading">
                    <div>
                        <h2>작성한 게시글</h2>
                        <p>최근 작성한 순서로 확인할 수 있습니다.</p>
                    </div>
                    <span id="myPostCount" class="count-badge">0개</span>
                </div>
                <div id="myPostList" class="mypage-list"></div>
                <div id="myPostPagination" class="pagination"></div>
            </div>

            <div id="commentsPanel" class="mypage-panel" role="tabpanel"
                 aria-labelledby="commentsTab" data-panel="comments" hidden>
                <div class="panel-heading">
                    <div>
                        <h2>작성한 댓글</h2>
                        <p>댓글을 선택하면 해당 게시글로 이동합니다.</p>
                    </div>
                    <span id="myCommentCount" class="count-badge">0개</span>
                </div>
                <div id="myCommentList" class="mypage-list"></div>
                <div id="myCommentPagination" class="pagination"></div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
