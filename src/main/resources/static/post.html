<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>

    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">

    <script defer src="/js/theme.js"></script>
    <script defer src="/js/api.js"></script>
    <script defer src="/js/ui.js"></script>
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/likes.js"></script>
    <script defer src="/js/comments.js"></script>
    <script defer src="/js/posts.js"></script>
    <script defer src="/js/post-detail.js"></script>
</head>
<body>
<button id="themeToggle" class="theme-btn">🌙</button>

<main class="auth-container detail-page-container">
    <div class="page-layout">
        <button id="backToListButton" type="button" class="secondary-btn back-button">
            목록으로
        </button>

        <section class="auth-card post-section detail-page-card">
            <div id="detailLoading" class="description">게시글을 불러오는 중입니다...</div>
            <div id="detailError" class="message"></div>

            <article id="detailArticle" hidden>
                <div class="detail-header">
                    <h1 id="detailTitle">게시글 상세</h1>
                </div>

                <p id="detailContent" class="detail-content"></p>

                <div class="detail-meta">
                    <span id="detailWriter"></span>
                    <span id="detailDate"></span>
                </div>

                <div class="detail-actions">
                    <button type="button" id="likeButton" class="secondary-btn compact-btn">좋아요</button>
                    <span id="likeCount" class="like-count">0개</span>
                    <button type="button" id="editPostButton" class="secondary-btn compact-btn">수정</button>
                    <button type="button" id="deletePostButton" class="danger-btn compact-btn">삭제</button>
                </div>
            </article>
        </section>

        <section class="auth-card comment-section detail-page-card">
            <h2>댓글</h2>
            <div id="commentList" class="comment-list"></div>
            <div id="commentPagination" class="pagination"></div>

            <form id="commentForm" class="comment-form">
                <textarea
                        id="commentContent"
                        placeholder="댓글을 입력하세요"
                        maxlength="6000"
                ></textarea>
                <div id="commentContentCount" class="char-count">0 / 6000</div>
                <p id="commentMessage" class="message"></p>
                <button id="commentSubmitButton" type="submit" class="primary-btn">댓글 등록</button>
            </form>
        </section>
    </div>
</main>

<div id="postModalOverlay" class="modal-overlay">
    <div class="post-modal">
        <h2 id="postModalTitle">게시글 수정</h2>

        <form id="postCreateForm">
            <input id="postId" type="hidden">

            <input
                    id="postTitle"
                    type="text"
                    placeholder="제목을 입력하세요"
                    maxlength="100"
            >
            <div id="postTitleCount" class="char-count">0 / 100</div>

            <textarea
                    id="postContent"
                    placeholder="내용을 입력하세요"
                    maxlength="6000"
            ></textarea>
            <div id="postContentCount" class="char-count">0 / 6000</div>

            <p id="postCreateMessage" class="message"></p>

            <div class="modal-buttons">
                <button type="button" id="closePostModalButton" class="secondary-btn">
                    취소
                </button>

                <button id="postSubmitButton" type="submit" class="primary-btn">
                    저장
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
